services:
  lilo_hub:
    build: .
    container_name: lilo_hub
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      - TZ=America/Santiago
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./data:/app/data
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json
      - ${HOST_VAULT_PATH:-./vault}:/vault
      - ${HOST_BACKUPS_PATH:-./backups}:/backups
      - /var/run/docker.sock:/var/run/docker.sock:ro

  webdav:
    image: hacdias/webdav:latest
    container_name: obsidian_webdav
    restart: unless-stopped
    working_dir: /data
    ports:
      - "8080:8080"
    volumes:
      - ${HOST_VAULT_PATH:-./vault}:/data
      - ./webdav.yaml:/etc/webdav/config.yaml:ro
