services:
  lilo_hub:
    build: .
    container_name: lilo_hub
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      - TZ=America/Santiago
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./data:/app/data
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json
      - /mnt/disco_1tb/obsidian_vault:/vault
      - /mnt/disco_1tb/backups/lilo_hub:/backups
      - /var/run/docker.sock:/var/run/docker.sock:ro

  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Santiago
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - /mnt/disco_1tb/syncthing_config:/config
      - /mnt/disco_1tb/obsidian_vault:/data/obsidian_vault
    ports:
      - "8384:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
